name: orderflow
x-service: &service
  restart: unless-stopped
  environment: &common
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow
    SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-orderflow}
    SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-orderflow}
    SPRING_RABBITMQ_HOST: rabbitmq
    SPRING_DATA_REDIS_HOST: redis
    JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-123456}
  depends_on:
    postgres: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: orderflow, POSTGRES_USER: "${POSTGRES_USER:-orderflow}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-orderflow}"}
    volumes: [postgres-data:/var/lib/postgresql/data, ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"], interval: 5s, timeout: 3s, retries: 10}
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 10}
  auth-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: auth-service}}
    ports: ["8081:8081"]
  product-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: product-service}}
    ports: ["8082:8082"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  cart-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: cart-service}}
    ports: ["8083:8083"]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  order-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: order-service}}
    ports: ["8084:8084"]
  inventory-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: inventory-service}}
    ports: ["8085:8085"]
  payment-service:
    <<: *service
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: payment-service}}
    ports: ["8086:8086"]
    environment: {<<: *common, PAYMENT_FAILURE_RATE: "${PAYMENT_FAILURE_RATE:-0.10}"}
  api-gateway:
    build: {context: ., dockerfile: docker/service.Dockerfile, args: {SERVICE: api-gateway}}
    environment: {JWT_SECRET: "${JWT_SECRET:-development-only-secret-change-me-123456}"}
    ports: ["8080:8080"]
    depends_on: [auth-service, product-service, cart-service, order-service, inventory-service, payment-service]
  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api-gateway]
volumes: {postgres-data: {}}
